name: CI
on:
  pull_request:
  push:
    branches: [main, feature/multi-profile-connectors]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<1' 'starlette>=0.38,<1' 'uvicorn>=0.30,<1'
      - run: python -W error::ResourceWarning -m unittest tests.test_connection_profiles tests.test_gateway_security tests.test_transport -v
        env:
          PYTHONPATH: src
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with optional gateway dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install -e '.[tailscale]'
          if ($LASTEXITCODE) { throw 'Install failed' }
      - name: Verify dependencies, regression suite, real MCP and reproducible packages
        shell: pwsh
        run: .\scripts\verify-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: validated-bootstrap
          path: |
            dist/*.zip
            dist/*.whl
            dist/SHA256SUMS.txt
            dist/release-manifest.json

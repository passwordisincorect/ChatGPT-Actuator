name: Tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and check version
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install -e '.[tailscale]'
          if ($LASTEXITCODE) { throw 'Install failed' }
          $Version = .\.venv\Scripts\python.exe -c "import chatgpt_actuator; print(chatgpt_actuator.__version__)"
          if ("v$Version" -ne $env:GITHUB_REF_NAME) { throw 'Tag and project version differ' }
      - name: Verify before publishing
        shell: pwsh
        run: .\scripts\verify-release.ps1
      - name: Publish versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Version = .\.venv\Scripts\python.exe -c "import chatgpt_actuator; print(chatgpt_actuator.__version__)"
          gh release create $env:GITHUB_REF_NAME "dist/ChatGPT-Actuator-$Version-bootstrap-portable.zip" "dist/chatgpt_actuator-$Version-py3-none-any.whl" dist/SHA256SUMS.txt dist/release-manifest.json --verify-tag --title "ChatGPT-Actuator $env:GITHUB_REF_NAME" --notes-file "RELEASE_NOTES_$Version.md"
          if ($LASTEXITCODE) { throw 'Release failed' }
